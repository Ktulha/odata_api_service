[project]
name = "ics-odata-api"
version = "0.1.0"
description = "Read-only caching API proxy for 1C OData (Flask + SQLAlchemy)"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "sqlalchemy==2.0.36",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
    "click>=8.1",
    "croniter>=2.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/odata_cache"]

[project.scripts]
odata-api = "odata_cache.cli:cli"
